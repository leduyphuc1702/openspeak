name: OpenSpeak
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OpenSpeak:
    type: application
    platform: iOS
    sources:
      - path: OpenSpeak
    configFiles:
      Debug: Config/Server.xcconfig
      Release: Config/Server.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.openspeak
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: OpenSpeak/Info.plist
      properties:
        CFBundleDisplayName: OpenSpeak
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: OpenSpeak cần micro để nghe và chấm phát âm của bạn.
        NSCameraUsageDescription: OpenSpeak dùng camera trước để đo khẩu hình môi khi bạn nói và gửi ảnh cận miệng cho AI nhận xét.
        NSSpeechRecognitionUsageDescription: OpenSpeak chuyển lời bạn nói thành chữ (ngay trên máy nếu được) để hội thoại với AI.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Kết nối tới máy chủ chấm phát âm trong mạng nội bộ.
        OpenSpeakServerURL: $(OPENSPEAK_SERVER_URL)
  OpenSpeakTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenSpeakTests
    dependencies:
      - target: OpenSpeak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.openspeak.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OpenSpeak.app/OpenSpeak
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
  OpenSpeakUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OpenSpeakUITests
    dependencies:
      - target: OpenSpeak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.openspeak.uitests
        TEST_TARGET_NAME: OpenSpeak
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenSpeak:
    build:
      targets:
        OpenSpeak: all
        OpenSpeakTests: [test]
        OpenSpeakUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenSpeakTests
        - OpenSpeakUITests
