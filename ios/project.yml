name: PhonoPath
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PhonoPath:
    type: application
    platform: iOS
    sources:
      - path: PhonoPath
    configFiles:
      Debug: Config/Server.xcconfig
      Release: Config/Server.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phonopath
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: PhonoPath/Info.plist
      properties:
        CFBundleDisplayName: PhonoPath
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: PhonoPath cần micro để nghe và chấm phát âm của bạn.
        NSCameraUsageDescription: PhonoPath dùng camera trước để đo khẩu hình môi khi bạn nói và gửi ảnh cận miệng cho AI nhận xét.
        NSSpeechRecognitionUsageDescription: PhonoPath chuyển lời bạn nói thành chữ (ngay trên máy nếu được) để hội thoại với AI.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Kết nối tới máy chủ chấm phát âm trong mạng nội bộ.
        PhonoPathServerURL: $(PHONOPATH_SERVER_URL)
  PhonoPathUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PhonoPathUITests
    dependencies:
      - target: PhonoPath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phonopath.uitests
        TEST_TARGET_NAME: PhonoPath
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PhonoPath:
    build:
      targets:
        PhonoPath: all
        PhonoPathUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhonoPathUITests
